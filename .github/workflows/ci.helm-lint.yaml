name: CI Helm Lint

on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
    branches:
      - idc-fly

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run Helm lint
        uses: WyriHaximus/github-action-helm3@v3
        id: lint
        with:
          exec: |
            failed_services=""
            for file in $(git diff --name-only HEAD~1..HEAD); do
              dir=$(dirname $file)
              if [ -f "$dir/Chart.yaml" ]; then
                # Lint only env-specific values (values.baobab.yaml, values.cypress.yaml);
                # the glob values.*.yaml excludes the base values.yaml on purpose.
                for values_file in "$dir"/values.*.yaml; do
                  # Skip when the glob matched nothing (chart has no env-specific values).
                  [ -e "$values_file" ] || continue
                  if ! helm lint "$dir" -f "$values_file"; then
                    failed_services+="'$(basename $dir)', "
                  fi
                done
              fi
            done

            if [ -n "$failed_services" ]; then
              # Remove the trailing comma and space
              failed_services=${failed_services%??}
              echo "failed_services=$failed_services" >> $GITHUB_OUTPUT
            fi

      - name: Failed services
        if: steps.lint.outputs.failed_services
        run: |
          echo "Failed services: ${{ steps.lint.outputs.failed_services }}"
          exit 1
